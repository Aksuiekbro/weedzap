<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct ONNX Test - Phase 3 Deep Fix</title>
    <!-- ONNX.js - Updated to latest version for YOLOv7 compatibility -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/ort.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: white;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #333;
        }
        .success { background: rgba(0, 255, 136, 0.2); border-color: #00ff88; }
        .error { background: rgba(255, 68, 68, 0.2); border-color: #ff4444; }
        .loading { background: rgba(255, 136, 0, 0.2); border-color: #ff8800; }
        pre { 
            background: #2a2a2a; 
            padding: 10px; 
            border-radius: 5px; 
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 600px;
            overflow-y: auto;
        }
        button {
            background: #00ff88;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            color: black;
            cursor: pointer;
            margin: 5px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>🧪 Direct ONNX Test - Phase 3 Deep Fix</h1>
    
    <div id="status" class="status">
        Ready to test Phase 3 Deep Fix diagnostics...
    </div>
    
    <button onclick="runPhase3Test()" style="font-size: 18px; padding: 15px 30px;">
        🚀 RUN PHASE 3 DEEP TEST
    </button>
    
    <h3>Phase 3 Deep Diagnostics Output:</h3>
    <pre id="console-output"></pre>

    <script>
        // Console capture
        let originalConsoleLog = console.log;
        let originalConsoleError = console.error;
        
        function logToPage(type, ...args) {
            const output = document.getElementById('console-output');
            const timestamp = new Date().toLocaleTimeString();
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            
            output.textContent += `[${timestamp}] ${type.toUpperCase()}: ${message}\n`;
            output.scrollTop = output.scrollHeight;
            
            if (type === 'log') originalConsoleLog(...args);
            else if (type === 'error') originalConsoleError(...args);
        }
        
        console.log = (...args) => logToPage('log', ...args);
        console.error = (...args) => logToPage('error', ...args);
        
        function updateStatus(message, type = '') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }
        
        async function runPhase3Test() {
            updateStatus('🔄 Running Phase 3 Deep Diagnostics...', 'loading');
            console.log('🚀 PHASE 3 DEEP TEST STARTING...');
            
            try {
                // Phase 3 Deep Fix: ONNX Runtime Web diagnostics
                console.log('🔍 PHASE 3: ONNX Runtime Environment Check');
                console.log('🔍 ONNX Runtime available:', typeof ort !== 'undefined');
                console.log('🔍 ONNX Runtime version:', ort.version || 'unknown');
                console.log('🔍 Available execution providers:', ort.env.wasm ? 'WASM available' : 'WASM not available');
                
                // Check model file
                console.log('🔍 Checking model file availability...');
                const modelPath = 'models/custom-models/tiny_model_680_final.onnx';
                const modelResponse = await fetch(modelPath, { method: 'HEAD' });
                
                if (!modelResponse.ok) {
                    throw new Error(`Model file not accessible: HTTP ${modelResponse.status}`);
                }
                
                const fileSize = modelResponse.headers.get('Content-Length');
                console.log(`✅ Model file accessible: ${(fileSize / 1024 / 1024).toFixed(1)}MB`);
                
                // Create session with ONNX Runtime Web
                console.log('🔧 Creating ONNX Runtime session...');
                const session = await ort.InferenceSession.create(modelPath, {
                    executionProviders: ['wasm'],
                    logSeverityLevel: 0 // Enable verbose logging
                });
                console.log('✅ Model loaded successfully with ONNX Runtime Web');
                
                // Model introspection
                console.log('🔍 Model introspection:');
                console.log('📥 Model input names:', session.inputNames);
                console.log('📤 Model output names:', session.outputNames);
                
                // Phase 3 Deep Fix: Dummy input test
                console.log('🧪 PHASE 3 DEEP FIX: Testing with dummy input...');
                
                const dummyData = new Float32Array(1 * 3 * 640 * 640);
                for (let i = 0; i < dummyData.length; i++) {
                    dummyData[i] = Math.random(); // Random values 0-1
                }
                
                const dummyTensor = new ort.Tensor('float32', dummyData, [1, 3, 640, 640]);
                console.log('🧪 Created dummy tensor:', {
                    type: dummyTensor.type,
                    dims: dummyTensor.dims,
                    dataLength: dummyTensor.data.length
                });
                
                const inputName = session.inputNames[0];
                const testInputs = {};
                testInputs[inputName] = dummyTensor;
                
                console.log('🧪 Running dummy inference...');
                const testOutputs = await session.run(testInputs);
                
                console.log('🧪 DUMMY INFERENCE RESULTS:');
                console.log('🧪 Output type:', typeof testOutputs);
                console.log('🧪 Output constructor:', testOutputs?.constructor?.name);
                console.log('🧪 Raw outputs:', testOutputs);
                
                // ONNX Runtime Web returns outputs as object with named properties
                if (testOutputs && typeof testOutputs === 'object') {
                    const keys = Object.keys(testOutputs);
                    console.log('🧪 Output keys:', keys);
                    
                    if (keys.length > 0) {
                        console.log('✅ DUMMY TEST SUCCESS: Model produces outputs!');
                        const firstKey = keys[0];
                        const firstOutput = testOutputs[firstKey];
                        console.log('🧪 First output key:', firstKey);
                        console.log('🧪 First output tensor:', {
                            type: firstOutput?.type,
                            dims: firstOutput?.dims,
                            dataLength: firstOutput?.data?.length
                        });
                        
                        // Log all outputs for complete diagnostics
                        keys.forEach(key => {
                            const output = testOutputs[key];
                            console.log(`🧪 Output "${key}":`, {
                                type: output?.type,
                                dims: output?.dims,
                                dataLength: output?.data?.length,
                                dataRange: output?.data ? [Math.min(...output.data.slice(0, 10)), Math.max(...output.data.slice(0, 10))] : 'N/A'
                            });
                        });
                        
                        updateStatus('✅ DUMMY TEST SUCCESS: ONNX Runtime Web works perfectly!', 'success');
                    } else {
                        console.error('❌ DUMMY TEST FAILED: Model returns empty Object');
                        updateStatus('❌ DUMMY TEST FAILED: Empty object returned', 'error');
                    }
                } else {
                    console.error('❌ DUMMY TEST FAILED: Unknown output format:', testOutputs);
                    updateStatus('❌ DUMMY TEST FAILED: Unknown output format', 'error');
                }
                
            } catch (error) {
                console.error('❌ Phase 3 Deep Test failed:', error);
                console.error('❌ Error stack:', error.stack);
                updateStatus(`❌ Test failed: ${error.message}`, 'error');
            }
        }
        
        window.addEventListener('load', () => {
            console.log('🌟 Phase 3 Deep Test Page Loaded');
            updateStatus('Ready to run Phase 3 Deep Diagnostics', 'success');
        });
    </script>
</body>
</html>
